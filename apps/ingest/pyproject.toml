[project]
name = "olake-ingest"
version = "0.1.0"
description = "Offline pipeline: fetch OLake docs and repos, chunk, embed, index"
requires-python = ">=3.11"
dependencies = [
    "olake-shared",
    "typer>=0.12",
    "rich>=13",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "markdown-it-py>=3",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
]

[project.scripts]
olake-ingest = "olake_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olake_ingest"]

[tool.uv.sources]
olake-shared = { workspace = true }
