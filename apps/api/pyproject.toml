[project]
name = "olake-api"
version = "0.1.0"
description = "Answers questions about OLake from the indexed docs and code, with citations"
requires-python = ">=3.11"
dependencies = [
    "olake-shared",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "openai>=1.50",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
olake-api = "olake_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olake_api"]

[tool.uv.sources]
olake-shared = { workspace = true }
