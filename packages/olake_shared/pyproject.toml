[project]
name = "olake-shared"
version = "0.1.0"
description = "Data contract shared by ingestion and the API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olake_shared"]
